[project]
name = "tkctl-lab"
version = "0.1.0"
description = "Per-student tk8s VMs on Proxmox VE with Guacamole access, as a tkctl plugin"
readme = "README.md"
license = "GPL-2.0-or-later"
authors = [{ name = "Josh Hsieh", email = "josh.hsieh@linux.com" }]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
tkctl-lab = "tkctl_lab.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
